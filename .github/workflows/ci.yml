name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://nomflow:nomflow@localhost:5432/nomflow_test
      - run: npm run audit:deps
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  codeql:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: read, actions: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
  graph:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install graphifyy
      - run: graphify update .
      - uses: actions/upload-artifact@v4
        with:
          name: graphify-${{ github.sha }}
          path: |
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
            graphify-out/graph.json
          retention-days: 30
