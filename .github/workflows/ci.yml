name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomflow" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgresql://nomflow:nomflow@localhost:5432/nomflow_test
      - run: npm run audit:deps
  secrets:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, actions: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      # Sube los resultados a Code scanning y, además, falla el job si el SARIF trae hallazgos.
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      - name: Fallar si hay hallazgos no descartados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Regla + archivo de las alertas ya descartadas en la pestaña Security (falsos positivos revisados)
          gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=dismissed&per_page=100" \
            --jq '[.[] | {r: .rule.id, p: .most_recent_instance.location.path}]' > dismissed.json
          cat codeql-results/*.sarif | jq --slurpfile d dismissed.json '
            [.runs[].results[]
             | {r: .ruleId, p: .locations[0].physicalLocation.artifactLocation.uri, l: .locations[0].physicalLocation.region.startLine}
             | select(. as $x | ($d[0] | any(.r == $x.r and .p == $x.p)) | not)]' > pending.json
          jq -r '.[] | "\(.r) \(.p):\(.l)"' pending.json
          total=$(jq length pending.json)
          echo "Hallazgos de CodeQL sin descartar: $total"
          test "$total" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
  graph:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "graphifyy[sql]==0.9.67"
      - run: graphify update .
      - uses: actions/upload-artifact@v4
        with:
          name: graphify-${{ github.sha }}
          path: |
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
            graphify-out/graph.json
          retention-days: 30
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nomflow" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      # Garage (almacenamiento de objetos). Las credenciales se generan aquí: no hay claves en el archivo.
      - name: Levantar Garage
        run: |
          {
            echo "S3_ENDPOINT=http://localhost:3900"
            echo "S3_REGION=garage"
            echo "S3_BUCKET=nomflow-private"
            echo "S3_TEST_BUCKET=nomflow-test"
            echo "S3_ACCESS_KEY_ID=GK$(openssl rand -hex 12)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "OBJECT_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
          docker run -d --name garage -p 3900:3900 -p 3903:3903 \
            -v "$PWD/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET="$(openssl rand -hex 32)" -e GARAGE_ADMIN_TOKEN="$(openssl rand -hex 24)" \
            dxflrs/garage:v2.4.1
      - run: GARAGE_EXEC="docker exec garage /garage" bash scripts/garage-init.sh
      - name: Integración con Garage real
        run: npm test -w @nomflow/api -- src/storage/garage.integration.spec.ts
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
