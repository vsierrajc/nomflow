# Garage (almacenamiento de objetos compatible con S3) para el entorno local y el CI.
# Un solo nodo, sin redundancia: NO es una configuración de producción (ver ADR-003).
# Los secretos no van aquí: GARAGE_RPC_SECRET y GARAGE_ADMIN_TOKEN llegan por variables de entorno.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"
