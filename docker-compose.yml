services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow }
    ports: ['5432:5432']
    # Volumen con nombre: los datos sobreviven a `docker compose down` (sin él serían anónimos y se perderían).
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
  garage:
    # Almacenamiento de objetos compatible con S3 (reemplaza a MinIO; ver docs/decisions/ADR-003).
    image: dxflrs/garage:v2.4.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
    ports: ['127.0.0.1:3900:3900', '127.0.0.1:3903:3903']
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 5s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  garage-meta:
  garage-data:
