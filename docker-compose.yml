services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow }
    ports: ['5432:5432']
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio
    command: server /data
    ports: ['9000:9000']
