services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: nomflow, POSTGRES_PASSWORD: nomflow, POSTGRES_DB: nomflow }
    ports: ['5432:5432']
    # Volumen con nombre: los datos sobreviven a `docker compose down` (sin él serían anónimos y se perderían).
    volumes: ['pgdata:/var/lib/postgresql/data']
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nomflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nomflow-dev-only}
    ports: ['9100:9000', '9101:9001']
    volumes: ['minio-data:/data']
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']

volumes:
  pgdata:
  minio-data:
